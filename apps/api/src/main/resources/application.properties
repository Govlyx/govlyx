spring.application.name=Govlyx-AI
server.port=${PORT:8081}

# Pre-warm all beans, connection pools, and caches on startup for zero-latency user requests
spring.main.lazy-initialization=false

# ── Supabase PgBouncer Transaction-Mode Pooler ─────────────────────────────
# Port 6543 = Supabase's PgBouncer in TRANSACTION mode.
# Benefits: up to 10 000 client connections multiplexed into ~15 real PG connections.
# Limitation: prepared statements and SET commands are NOT session-persistent.
#
# Username MUST use the project-scoped format: postgres.<project-ref>
# (plain "postgres" does NOT work with the pooler)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0&preparedStatementCacheQueries=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.xdwrgwufxxbpvonkemkj}
# SECURITY: Set SPRING_DATASOURCE_PASSWORD env var in production (Render/Railway).
# The fallback below is for local dev only — never commit prod credentials here.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Mr.7758091218@}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Flyway: bypass PgBouncer, connect DIRECTLY to Postgres ─────────────────
# Flyway runs DDL migrations inside transactions. PgBouncer transaction mode
# does NOT support multi-statement DDL transactions reliably. Flyway MUST use
# a direct connection (port 5432) to avoid "prepared statement does not exist"
# and transaction-state errors during migration.
spring.flyway.url=${FLYWAY_DATASOURCE_URL:jdbc:postgresql://db.xdwrgwufxxbpvonkemkj.supabase.co:5432/postgres?sslmode=require}
spring.flyway.user=${FLYWAY_DATASOURCE_USERNAME:postgres}
spring.flyway.password=${FLYWAY_DATASOURCE_PASSWORD:Mr.7758091218@}

# Zero-Knowledge Blind Shield — Cryptographic Secrets
govlyx.security.blind-pepper=${GOVLYX_BLIND_PEPPER:1023a41ebf7bead2c8d899dda6df33f56f3258e13a3a6b1ae4ecbac3b6b04e4e}
govlyx.security.email-pepper=${GOVLYX_EMAIL_PEPPER:7f2314478209f306d6f414393775d3182559e3bf3299c8ed2fca2ee13c46a7ff}
govlyx.security.aes-key=${GOVLYX_AES_KEY:1KneeS70HLdW2vW/8hLKnKcG+K34jHfSlCyfty51gMU=}




spring.jpa.open-in-view=false
# Flyway owns ALL schema changes. Hibernate only validates the entity model against the live schema.
# Using 'update' alongside Flyway causes dual schema-diffing on every startup: slower boot + drift risk.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Zero-Knowledge Blind Shield — Flyway baseline config (Bug 15)
# Required so Phase 7 migration scripts don't crash with
# "Found non-empty schema but no schema history table" on the existing DB.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false


# Performance Optimizations (Eliminates N+1 queries)
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
# ── HikariCP — tuned for PgBouncer transaction-mode pooler ───────────────────
# Pool size 10: PgBouncer multiplexes these into far fewer real PG connections.
# No need for 25 app-side connections when pooler handles the fan-out.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=60000
# keepalive: prevents Supabase/Render from dropping idle pooler connections
spring.datasource.hikari.keepalive-time=60000

# IMPORTANT: Prepared-statement caching is DISABLED for PgBouncer transaction mode.
# PgBouncer resets the Postgres session between transactions, so server-side
# prepared statements created in one transaction DO NOT exist in the next.
# prepareThreshold=0 forces pgJDBC to use unnamed statements, avoiding "prepared statement S_1 already exists / does not exist".
# preparedStatementCacheQueries=0 disables client-side statement caching.
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheSizeMiB=0

