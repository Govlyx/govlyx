<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon & Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1D4ED8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="referrer" content="no-referrer-when-downgrade" />

    <!-- Primary Meta Tags -->
    <title>Govlyx - Hyperlocal Neighborhood & Civic Engagement Platform</title>
    <meta
      name="description"
      content="Govlyx is India's premier neighborhood app. Report local municipal issues directly to authorities, track grievances, or connect anonymously via 1v1 chat with nearby people."
    />
    <meta
      name="keywords"
      content="Govlyx, Govlyx India, neighborhood government app India, citizen grievance redressal platform, anonymous chat nearby, talk to people in my area anonymously, omegle alternative for local neighborhood"
    />
    <meta name="author" content="Govlyx" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://govlyx.com/" />
    <meta property="og:site_name" content="Govlyx" />
    <meta property="og:locale" content="en_IN" />
    <meta
      property="og:title"
      content="Govlyx - Hyperlocal Neighborhood & Civic Engagement Platform"
    />
    <meta
      property="og:description"
      content="Report local municipal issues directly to authorities or connect anonymously via 1v1 chat with nearby people."
    />
    <meta property="og:image" content="https://govlyx.com/govlyx-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Govlyx Platform Preview" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://govlyx.com/" />
    <meta
      name="twitter:title"
      content="Govlyx - Hyperlocal Neighborhood & Civic Engagement Platform"
    />
    <meta
      name="twitter:description"
      content="Report local municipal issues directly to authorities or connect anonymously via 1v1 chat with nearby people."
    />
    <meta name="twitter:image" content="https://govlyx.com/govlyx-og.png" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'light';
          document.documentElement.setAttribute('data-theme', t);
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
